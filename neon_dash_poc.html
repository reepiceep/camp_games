<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neon Dash - Two Levels</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07101c;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
    }

    #gameWrap {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 25%, rgba(35, 180, 255, 0.18), transparent 38%),
        linear-gradient(#07101c, #101a31);
    }

    canvas {
      display: block;
      width: min(100vw, 1200px);
      height: auto;
      max-height: 100vh;
      aspect-ratio: 16 / 9;
      border: 2px solid rgba(255,255,255,0.18);
      background: #0d1830;
      box-shadow: 0 0 35px rgba(0, 220, 255, 0.22);
    }

    #hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .topBar {
      width: min(100vw, 1200px);
      margin: 0 auto;
      padding: 12px 18px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      font-weight: bold;
      text-shadow: 0 2px 4px #000;
    }

    #level {
      text-align: center;
      color: #7ff7ff;
    }

    #best {
      text-align: right;
    }

    #progressWrap {
      position: absolute;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      width: min(65vw, 650px);
      height: 12px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.45);
      border-radius: 999px;
      background: rgba(0,0,0,0.35);
    }

    #progress {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #24e5ff, #8c5dff);
      transition: width 0.08s linear;
    }

    #message {
      position: absolute;
      left: 50%;
      top: 43%;
      transform: translate(-50%, -50%);
      width: min(90%, 650px);
      padding: 25px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 18px;
      background: rgba(4, 10, 24, 0.78);
      text-align: center;
      backdrop-filter: blur(7px);
      pointer-events: auto;
    }

    #message h1 {
      margin: 0 0 10px;
      font-size: clamp(34px, 7vw, 76px);
      letter-spacing: 3px;
    }

    #message p {
      margin: 8px 0;
      color: #dcecff;
      font-size: clamp(15px, 2.3vw, 22px);
    }

    #message .small {
      font-size: 14px;
      opacity: 0.75;
    }

    #jumpButton {
      position: absolute;
      right: 24px;
      bottom: 24px;
      width: 92px;
      height: 92px;
      display: none;
      border: 3px solid rgba(255,255,255,0.45);
      border-radius: 50%;
      background: rgba(0, 220, 255, 0.18);
      color: #fff;
      font-weight: bold;
      font-size: 18px;
      pointer-events: auto;
      user-select: none;
      -webkit-user-select: none;
    }

    @media (pointer: coarse), (max-width: 800px) {
      #jumpButton { display: block; }

      .topBar {
        padding: 8px 10px;
        font-size: 13px;
      }

      #progressWrap {
        top: 40px;
        width: 55vw;
      }
    }
  </style>
</head>
<body>
<div id="gameWrap">
  <canvas id="game" width="1280" height="720"></canvas>

  <div id="hud">
    <div class="topBar">
      <div id="score">Score: 0</div>
      <div id="level">LEVEL 1</div>
      <div id="best">Best: 0</div>
    </div>

    <div id="progressWrap">
      <div id="progress"></div>
    </div>

    <div id="message">
      <h1>NEON DASH</h1>
      <p>Complete Level 1 and enter the finish portal.</p>
      <p>Level 2 is faster and has more difficult obstacle patterns.</p>
      <p><strong>Space</strong>, <strong>W</strong>, <strong>↑</strong>, click, or tap to jump.</p>
      <p class="small">Press or tap anywhere to begin.</p>
    </div>

    <button id="jumpButton" type="button" aria-label="Jump">JUMP</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const levelEl = document.getElementById("level");
  const progressEl = document.getElementById("progress");
  const messageEl = document.getElementById("message");
  const jumpButton = document.getElementById("jumpButton");

  const WORLD = {
    width: canvas.width,
    height: canvas.height,
    groundY: 590,
    gravity: 2500
  };

  const LEVELS = {
    1: {
      name: "LEVEL 1",
      length: 9000,
      baseSpeed: 455,
      maxSpeed: 610,
      acceleration: 5,
      minSpawn: 0.92,
      maxSpawn: 1.58,
      doubleChance: 0.20,
      tripleChance: 0,
      blockChance: 0.25
    },
    2: {
      name: "LEVEL 2",
      length: 12500,
      baseSpeed: 590,
      maxSpeed: 790,
      acceleration: 8,
      minSpawn: 0.66,
      maxSpawn: 1.20,
      doubleChance: 0.42,
      tripleChance: 0.14,
      blockChance: 0.34
    }
  };

  const state = {
    mode: "start",
    level: 1,
    score: 0,
    levelStartScore: 0,
    best: Number(localStorage.getItem("neonDashTwoLevelBest") || 0),
    elapsed: 0,
    distance: 0,
    spawnTimer: 0,
    nextSpawn: 1.1,
    finishSpawned: false,
    obstacles: [],
    particles: [],
    stars: [],
    lastTime: performance.now(),
    shake: 0
  };

  const player = {
    x: 220,
    y: WORLD.groundY - 54,
    size: 54,
    vy: 0,
    rotation: 0,
    onGround: true,
    jumpPower: 900
  };

  bestEl.textContent = `Best: ${state.best}`;

  for (let i = 0; i < 85; i++) {
    state.stars.push({
      x: Math.random() * WORLD.width,
      y: Math.random() * (WORLD.groundY - 110),
      r: 1 + Math.random() * 2,
      speed: 20 + Math.random() * 70
    });
  }

  function startLevel(level, preserveScore) {
    state.level = level;
    state.mode = "playing";
    state.elapsed = 0;
    state.distance = 0;
    state.spawnTimer = 0;
    state.nextSpawn = level === 1 ? 1.15 : 0.9;
    state.finishSpawned = false;
    state.obstacles.length = 0;
    state.particles.length = 0;
    state.shake = 0;

    if (!preserveScore) {
      state.score = level === 1 ? 0 : state.levelStartScore;
    }

    state.levelStartScore = state.score;

    player.y = WORLD.groundY - player.size;
    player.vy = 0;
    player.rotation = 0;
    player.onGround = true;

    levelEl.textContent = LEVELS[level].name;
    scoreEl.textContent = `Score: ${Math.floor(state.score)}`;
    progressEl.style.width = "0%";
    messageEl.style.display = "none";
  }

  function restartCurrentLevel() {
    state.score = state.levelStartScore;
    startLevel(state.level, true);
  }

  function jump() {
    if (state.mode === "start") {
      state.score = 0;
      startLevel(1, true);
      return;
    }

    if (state.mode === "gameover") {
      restartCurrentLevel();
      return;
    }

    if (state.mode === "levelcomplete") {
      startLevel(2, true);
      return;
    }

    if (state.mode === "victory") {
      state.score = 0;
      startLevel(1, true);
      return;
    }

    if (state.mode === "playing" && player.onGround) {
      player.vy = -player.jumpPower;
      player.onGround = false;

      for (let i = 0; i < 10; i++) {
        state.particles.push({
          x: player.x + player.size / 2,
          y: WORLD.groundY - 4,
          vx: -80 - Math.random() * 150,
          vy: -30 - Math.random() * 150,
          life: 0.45 + Math.random() * 0.3,
          maxLife: 0.75,
          color: "cyan"
        });
      }
    }
  }

  function addSpike(x, scale = 1) {
    state.obstacles.push({
      type: "spike",
      x,
      y: WORLD.groundY,
      width: 58 * scale,
      height: 62 * scale
    });
  }

  function addBlock(x, tall = false) {
    const minHeight = state.level === 2 ? 82 : 65;
    const extraHeight = tall ? 105 : 65;
    const h = minHeight + Math.random() * extraHeight;

    state.obstacles.push({
      type: "block",
      x,
      y: WORLD.groundY - h,
      width: state.level === 2 ? 72 : 68,
      height: h
    });
  }

  function spawnObstacle() {
    const config = LEVELS[state.level];
    const startX = WORLD.width + 60;
    const roll = Math.random();

    if (roll < config.blockChance) {
      addBlock(startX, state.level === 2 && Math.random() < 0.35);

      if (state.level === 2 && Math.random() < 0.20) {
        addSpike(startX + 90);
      }
    } else {
      addSpike(startX);

      const patternRoll = Math.random();

      if (patternRoll < config.tripleChance) {
        addSpike(startX + 58);
        addSpike(startX + 116);
      } else if (patternRoll < config.doubleChance) {
        addSpike(startX + 58);
      }
    }

    const difficulty = Math.min(0.22, state.elapsed * 0.0025);
    state.nextSpawn =
      config.minSpawn +
      Math.random() * (config.maxSpawn - config.minSpawn) -
      difficulty;
  }

  function spawnFinishPortal() {
    state.finishSpawned = true;
    state.obstacles.push({
      type: "finish",
      x: WORLD.width + 180,
      y: WORLD.groundY - 190,
      width: 84,
      height: 190
    });
  }

  function playerHitbox() {
    const inset = 8;
    return {
      x: player.x + inset,
      y: player.y + inset,
      w: player.size - inset * 2,
      h: player.size - inset * 2
    };
  }

  function obstacleHitbox(obstacle) {
    if (obstacle.type === "spike") {
      return {
        x: obstacle.x + 12,
        y: obstacle.y - obstacle.height + 18,
        w: obstacle.width - 24,
        h: obstacle.height - 18
      };
    }

    if (obstacle.type === "finish") {
      return {
        x: obstacle.x + 8,
        y: obstacle.y,
        w: obstacle.width - 16,
        h: obstacle.height
      };
    }

    return {
      x: obstacle.x + 4,
      y: obstacle.y + 4,
      w: obstacle.width - 8,
      h: obstacle.height - 4
    };
  }

  function intersects(a, b) {
    return (
      a.x < b.x + b.w &&
      a.x + a.w > b.x &&
      a.y < b.y + b.h &&
      a.y + a.h > b.y
    );
  }

  function createBurst(amount, color = "cyan") {
    for (let i = 0; i < amount; i++) {
      state.particles.push({
        x: player.x + player.size / 2,
        y: player.y + player.size / 2,
        vx: -400 + Math.random() * 800,
        vy: -500 + Math.random() * 700,
        life: 0.6 + Math.random() * 0.8,
        maxLife: 1.4,
        color
      });
    }
  }

  function saveBest() {
    const finalScore = Math.floor(state.score);

    if (finalScore > state.best) {
      state.best = finalScore;
      localStorage.setItem("neonDashTwoLevelBest", String(state.best));
      bestEl.textContent = `Best: ${state.best}`;
    }
  }

  function die() {
    if (state.mode !== "playing") return;

    state.mode = "gameover";
    state.shake = 0.45;
    createBurst(38, "cyan");
    saveBest();

    messageEl.innerHTML = `
      <h1>CRASH!</h1>
      <p>You reached Level ${state.level}.</p>
      <p>Score: <strong>${Math.floor(state.score)}</strong></p>
      <p class="small">Press Space, click, or tap to restart this level.</p>
    `;
    messageEl.style.display = "block";
  }

  function completeLevel() {
    state.obstacles.length = 0;
    createBurst(50, "gold");
    saveBest();

    if (state.level === 1) {
      state.mode = "levelcomplete";
      state.levelStartScore = state.score;

      messageEl.innerHTML = `
        <h1>LEVEL 1 COMPLETE!</h1>
        <p>Excellent! Level 2 is faster and has tighter obstacle patterns.</p>
        <p>Score: <strong>${Math.floor(state.score)}</strong></p>
        <p class="small">Press Space, click, or tap to start Level 2.</p>
      `;
      messageEl.style.display = "block";
    } else {
      state.mode = "victory";

      messageEl.innerHTML = `
        <h1>YOU WIN!</h1>
        <p>You completed both levels.</p>
        <p>Final score: <strong>${Math.floor(state.score)}</strong></p>
        <p class="small">Press Space, click, or tap to play again.</p>
      `;
      messageEl.style.display = "block";
    }
  }

  function update(dt) {
    const config = LEVELS[state.level];
    const speed = Math.min(
      config.maxSpeed,
      config.baseSpeed + state.elapsed * config.acceleration
    );

    for (const star of state.stars) {
      const levelMultiplier = state.level === 2 ? 1.45 : 1;
      star.x -= star.speed * levelMultiplier * dt;

      if (star.x < -5) {
        star.x = WORLD.width + 5;
        star.y = Math.random() * (WORLD.groundY - 110);
      }
    }

    if (state.mode === "playing") {
      state.elapsed += dt;
      state.distance += speed * dt;
      state.score += dt * (state.level === 2 ? 16 : 10);

      scoreEl.textContent = `Score: ${Math.floor(state.score)}`;

      const progress = Math.min(100, (state.distance / config.length) * 100);
      progressEl.style.width = `${progress}%`;

      player.vy += WORLD.gravity * dt;
      player.y += player.vy * dt;

      if (!player.onGround) {
        player.rotation += dt * (state.level === 2 ? 7 : 5.5);
      }

      if (player.y + player.size >= WORLD.groundY) {
        player.y = WORLD.groundY - player.size;
        player.vy = 0;
        player.onGround = true;
        player.rotation =
          Math.round(player.rotation / (Math.PI / 2)) * (Math.PI / 2);
      }

      if (!state.finishSpawned && state.distance < config.length - 850) {
        state.spawnTimer += dt;

        if (state.spawnTimer >= state.nextSpawn) {
          state.spawnTimer = 0;
          spawnObstacle();
        }
      }

      if (!state.finishSpawned && state.distance >= config.length - 700) {
        state.obstacles = state.obstacles.filter(
          obstacle => obstacle.x < WORLD.width - 100
        );
        spawnFinishPortal();
      }

      for (const obstacle of state.obstacles) {
        obstacle.x -= speed * dt;
      }

      state.obstacles = state.obstacles.filter(
        obstacle => obstacle.x + obstacle.width > -120
      );

      const playerBox = playerHitbox();

      for (const obstacle of state.obstacles) {
        if (!intersects(playerBox, obstacleHitbox(obstacle))) continue;

        if (obstacle.type === "finish") {
          completeLevel();
        } else {
          die();
        }
        break;
      }
    }

    for (const particle of state.particles) {
      particle.x += particle.vx * dt;
      particle.y += particle.vy * dt;
      particle.vy += 700 * dt;
      particle.life -= dt;
    }

    state.particles = state.particles.filter(
      particle => particle.life > 0
    );

    if (state.shake > 0) {
      state.shake -= dt;
    }
  }

  function drawBackground() {
    const levelTwo = state.level === 2;

    const gradient = ctx.createLinearGradient(0, 0, 0, WORLD.height);
    gradient.addColorStop(0, levelTwo ? "#19071e" : "#071224");
    gradient.addColorStop(0.65, levelTwo ? "#35133e" : "#132342");
    gradient.addColorStop(1, levelTwo ? "#49152e" : "#17294c");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, WORLD.width, WORLD.height);

    ctx.save();
    ctx.globalAlpha = 0.72;

    for (const star of state.stars) {
      ctx.fillStyle = levelTwo ? "#ffd1f1" : "#c8f8ff";
      ctx.beginPath();
      ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();

    const offset = -(state.distance * 0.25) % 140;
    ctx.strokeStyle = levelTwo
      ? "rgba(255, 70, 180, 0.10)"
      : "rgba(30, 220, 255, 0.09)";
    ctx.lineWidth = 2;

    for (let x = offset; x < WORLD.width + 140; x += 140) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, WORLD.groundY);
      ctx.stroke();
    }

    for (let y = 70; y < WORLD.groundY; y += 70) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(WORLD.width, y);
      ctx.stroke();
    }

    const mountainOffset = -(state.distance * 0.15) % 420;
    ctx.fillStyle = levelTwo
      ? "rgba(105, 31, 92, 0.58)"
      : "rgba(34, 72, 125, 0.55)";

    for (let x = mountainOffset - 420; x < WORLD.width + 420; x += 420) {
      ctx.beginPath();
      ctx.moveTo(x, WORLD.groundY);
      ctx.lineTo(x + 120, levelTwo ? 320 : 360);
      ctx.lineTo(x + 230, WORLD.groundY);
      ctx.lineTo(x + 330, levelTwo ? 385 : 430);
      ctx.lineTo(x + 420, WORLD.groundY);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawGround() {
    const levelTwo = state.level === 2;

    ctx.fillStyle = levelTwo ? "#1e0b1c" : "#0b1426";
    ctx.fillRect(0, WORLD.groundY, WORLD.width, WORLD.height - WORLD.groundY);

    ctx.fillStyle = levelTwo ? "#ff4eb8" : "#22dff3";
    ctx.fillRect(0, WORLD.groundY, WORLD.width, 7);

    const tile = 56;
    const offset = -(state.distance % tile);

    for (let x = offset - tile; x < WORLD.width + tile; x += tile) {
      ctx.fillStyle =
        ((Math.floor((x - offset) / tile) & 1) === 0)
          ? (levelTwo
              ? "rgba(255, 54, 170, 0.15)"
              : "rgba(0, 210, 255, 0.13)")
          : "rgba(123, 77, 255, 0.11)";

      ctx.fillRect(
        x,
        WORLD.groundY + 8,
        tile,
        WORLD.height - WORLD.groundY
      );
    }
  }

  function drawPlayer() {
    ctx.save();
    ctx.translate(
      player.x + player.size / 2,
      player.y + player.size / 2
    );
    ctx.rotate(player.rotation);

    ctx.shadowColor = state.level === 2 ? "#ff5ac8" : "#28e8ff";
    ctx.shadowBlur = 22;

    const gradient = ctx.createLinearGradient(-25, -25, 25, 25);

    if (state.level === 2) {
      gradient.addColorStop(0, "#ff67ce");
      gradient.addColorStop(1, "#704dff");
    } else {
      gradient.addColorStop(0, "#54f5ff");
      gradient.addColorStop(1, "#7359ff");
    }

    ctx.fillStyle = gradient;
    ctx.fillRect(
      -player.size / 2,
      -player.size / 2,
      player.size,
      player.size
    );

    ctx.shadowBlur = 0;
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 4;
    ctx.strokeRect(
      -player.size / 2 + 3,
      -player.size / 2 + 3,
      player.size - 6,
      player.size - 6
    );

    ctx.fillStyle = "#08111f";
    ctx.fillRect(-13, -9, 8, 10);
    ctx.fillRect(7, -9, 8, 10);
    ctx.fillRect(-12, 11, 28, 6);

    ctx.restore();
  }

  function drawFinishPortal(obstacle) {
    const pulse = 1 + Math.sin(performance.now() / 130) * 0.06;
    const centerX = obstacle.x + obstacle.width / 2;
    const centerY = obstacle.y + obstacle.height / 2;

    ctx.save();
    ctx.translate(centerX, centerY);
    ctx.scale(pulse, pulse);

    ctx.shadowColor = "#ffe96b";
    ctx.shadowBlur = 34;
    ctx.strokeStyle = "#ffe96b";
    ctx.lineWidth = 12;
    ctx.beginPath();
    ctx.ellipse(0, 0, 42, 92, 0, 0, Math.PI * 2);
    ctx.stroke();

    ctx.shadowBlur = 12;
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.ellipse(0, 0, 26, 72, 0, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = "rgba(255, 233, 107, 0.22)";
    ctx.beginPath();
    ctx.ellipse(0, 0, 25, 70, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    ctx.fillStyle = "#fff";
    ctx.font = "bold 20px Arial";
    ctx.textAlign = "center";
    ctx.fillText(
      state.level === 1 ? "LEVEL 2" : "FINISH",
      centerX,
      obstacle.y - 18
    );
  }

  function drawObstacles() {
    for (const obstacle of state.obstacles) {
      if (obstacle.type === "finish") {
        drawFinishPortal(obstacle);
        continue;
      }

      if (obstacle.type === "spike") {
        ctx.save();
        ctx.shadowColor = state.level === 2 ? "#ff5ac8" : "#ff3f88";
        ctx.shadowBlur = 18;

        const gradient = ctx.createLinearGradient(
          obstacle.x,
          obstacle.y,
          obstacle.x,
          obstacle.y - obstacle.height
        );

        gradient.addColorStop(
          0,
          state.level === 2 ? "#c91dff" : "#ff246d"
        );
        gradient.addColorStop(1, "#ffcf3f");

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.moveTo(obstacle.x, obstacle.y);
        ctx.lineTo(
          obstacle.x + obstacle.width / 2,
          obstacle.y - obstacle.height
        );
        ctx.lineTo(obstacle.x + obstacle.width, obstacle.y);
        ctx.closePath();
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.restore();
      } else {
        ctx.save();
        ctx.shadowColor = state.level === 2 ? "#ff4da8" : "#a95cff";
        ctx.shadowBlur = 16;
        ctx.fillStyle = state.level === 2 ? "#d2308e" : "#8a47ff";
        ctx.fillRect(
          obstacle.x,
          obstacle.y,
          obstacle.width,
          obstacle.height
        );

        ctx.shadowBlur = 0;
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 3;
        ctx.strokeRect(
          obstacle.x + 2,
          obstacle.y + 2,
          obstacle.width - 4,
          obstacle.height - 4
        );

        ctx.strokeStyle = "rgba(255,255,255,0.35)";
        ctx.beginPath();
        ctx.moveTo(obstacle.x + 12, obstacle.y + 14);
        ctx.lineTo(
          obstacle.x + obstacle.width - 12,
          obstacle.y + obstacle.height - 14
        );
        ctx.moveTo(
          obstacle.x + obstacle.width - 12,
          obstacle.y + 14
        );
        ctx.lineTo(
          obstacle.x + 12,
          obstacle.y + obstacle.height - 14
        );
        ctx.stroke();
        ctx.restore();
      }
    }
  }

  function drawParticles() {
    for (const particle of state.particles) {
      const alpha = Math.max(0, particle.life / particle.maxLife);

      if (particle.color === "gold") {
        ctx.fillStyle = `rgba(255, 232, 92, ${alpha})`;
      } else {
        ctx.fillStyle = state.level === 2
          ? `rgba(255, 90, 200, ${alpha})`
          : `rgba(65, 235, 255, ${alpha})`;
      }

      ctx.fillRect(particle.x, particle.y, 7, 7);
    }
  }

  function render() {
    ctx.save();

    if (state.shake > 0) {
      ctx.translate(
        (Math.random() - 0.5) * 18,
        (Math.random() - 0.5) * 18
      );
    }

    drawBackground();
    drawGround();
    drawObstacles();

    if (state.mode !== "gameover" || state.particles.length < 30) {
      drawPlayer();
    }

    drawParticles();
    ctx.restore();
  }

  function loop(now) {
    const dt = Math.min((now - state.lastTime) / 1000, 0.033);
    state.lastTime = now;

    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function handleInput(event) {
    if (event) event.preventDefault();
    jump();
  }

  window.addEventListener("keydown", event => {
    if (["Space", "ArrowUp", "KeyW"].includes(event.code)) {
      handleInput(event);
    }
  });

  canvas.addEventListener("pointerdown", handleInput);
  messageEl.addEventListener("pointerdown", handleInput);
  jumpButton.addEventListener("pointerdown", handleInput);

  document.addEventListener("visibilitychange", () => {
    state.lastTime = performance.now();
  });

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moon Clicker</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#fff;background:radial-gradient(circle at 30% 20%,#25256a44,transparent 30%),linear-gradient(#050516,#0d0730 60%,#020208);overflow-x:hidden;user-select:none}.game{width:min(1050px,95%);margin:auto;padding:24px 0 40px}h1{text-align:center;font-size:clamp(2.4rem,7vw,4.5rem);letter-spacing:5px;margin:0;text-shadow:0 0 12px #adc4ff,0 0 32px #765cff}.sub{text-align:center;color:#cad3ff;margin:8px 0 20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat,.panel{background:#11103bbd;border:1px solid #9eb0ff40;border-radius:16px;box-shadow:0 12px 30px #0006;backdrop-filter:blur(8px)}.stat{text-align:center;padding:12px}.stat b{display:block;color:#fff1a3;font-size:1.25rem;margin-top:5px}.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin-top:18px}.panel{padding:18px}.moon-zone{min-height:510px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}.moon{width:clamp(220px,34vw,340px);aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;background:radial-gradient(circle at 32% 28%,#fffde8 0 8%,transparent 9%),radial-gradient(circle at 68% 26%,#7775 0 8%,transparent 9%),radial-gradient(circle at 67% 67%,#6665 0 12%,transparent 13%),radial-gradient(circle at 38% 70%,#7774 0 8%,transparent 9%),radial-gradient(circle at 45% 42%,#fff9d8,#bfc1c8 67%,#74788b);box-shadow:0 0 25px #d9e4ff,0 0 70px #829effcc,0 0 130px #6d3cff66,inset -25px -18px 35px #181d4766;transition:.08s;animation:float 3s ease-in-out infinite}.moon:hover{filter:brightness(1.08)}.moon:active{transform:scale(.91)}@keyframes float{50%{translate:0 10px}}#phase{margin-top:26px;font-size:1.25rem;font-weight:bold;color:#d8deff}#combo{height:32px;margin-top:10px;color:#ffd86f;font-size:1.2rem;font-weight:bold}.shop h2{text-align:center;margin:0 0 12px}.upgrade{width:100%;display:grid;grid-template-columns:45px 1fr auto;align-items:center;gap:10px;margin:9px 0;padding:13px;border:1px solid #a8b7ff38;border-radius:13px;background:linear-gradient(135deg,#34346fe8,#19164de8);color:#fff;text-align:left;cursor:pointer}.upgrade:hover:not(:disabled){filter:brightness(1.15);transform:translateY(-2px)}.upgrade:disabled{opacity:.45;cursor:not-allowed}.icon{font-size:1.9rem;text-align:center}.upgrade strong,.upgrade small{display:block}.upgrade small{color:#c8cef0;margin-top:3px}.price{color:#ffe578;font-weight:bold}.buttons{display:flex;gap:10px;margin-top:13px}.buttons button{flex:1;padding:10px;border-radius:10px;border:1px solid #b9c3ff55;background:#353469;color:#fff;cursor:pointer}.goal{text-align:center;padding:10px;border-radius:10px;background:#ffd75a15;color:#ffe48a;margin-top:13px}.float{position:fixed;pointer-events:none;font-size:1.4rem;font-weight:900;color:#fff39b;text-shadow:0 0 8px #ffb900;animation:rise .8s forwards}@keyframes rise{to{transform:translateY(-90px) scale(1.2);opacity:0}}.star{position:fixed;background:#fff;border-radius:50%;pointer-events:none;animation:twinkle 2s infinite alternate}@keyframes twinkle{from{opacity:.2}to{opacity:1}}@media(max-width:750px){.stats{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.moon-zone{min-height:430px}}
</style>
</head>
<body><div id="stars"></div><main class="game"><h1>MOON CLICKER</h1><div class="sub">Click the moon and build a lunar empire!</div><section class="stats"><div class="stat">Moon Dust<b id="dust">0</b></div><div class="stat">Per Click<b id="pc">1</b></div><div class="stat">Per Second<b id="ps">0</b></div><div class="stat">Clicks<b id="clicks">0</b></div></section><section class="layout"><div class="panel moon-zone"><button class="moon" id="moon"></button><div id="phase">🌑 New Moon Explorer</div><div id="combo"></div></div><aside class="panel shop"><h2>LUNAR UPGRADES</h2>
<button class="upgrade" data-u="glove"><span class="icon">🧤</span><span><strong>Space Glove <b id="gloveL">Lv. 0</b></strong><small>+1 dust per click</small></span><span class="price" id="gloveP">15</span></button>
<button class="upgrade" data-u="drill"><span class="icon">⛏️</span><span><strong>Moon Drill <b id="drillL">Lv. 0</b></strong><small>+2 dust per second</small></span><span class="price" id="drillP">50</span></button>
<button class="upgrade" data-u="rover"><span class="icon">🚙</span><span><strong>Lunar Rover <b id="roverL">Lv. 0</b></strong><small>+10 dust per second</small></span><span class="price" id="roverP">250</span></button>
<button class="upgrade" data-u="laser"><span class="icon">🔭</span><span><strong>Moon Laser <b id="laserL">Lv. 0</b></strong><small>+8 dust per click</small></span><span class="price" id="laserP">600</span></button>
<button class="upgrade" data-u="base"><span class="icon">🏢</span><span><strong>Moon Base <b id="baseL">Lv. 0</b></strong><small>+50 dust per second</small></span><span class="price" id="baseP">1500</span></button>
<button class="upgrade" data-u="portal"><span class="icon">🌀</span><span><strong>Cosmic Portal <b id="portalL">Lv. 0</b></strong><small>Doubles click power</small></span><span class="price" id="portalP">5000</span></button>
<div class="goal" id="goal">First goal: collect 100 moon dust.</div><div class="buttons"><button id="save">Save</button><button id="reset">Reset</button></div></aside></section></main>
<script>
const D={dust:0,clicks:0,combo:0,last:0,l:{glove:0,drill:0,rover:0,laser:0,base:0,portal:0}},U={glove:[15,1.35],drill:[50,1.42],rover:[250,1.48],laser:[600,1.53],base:[1500,1.58],portal:[5000,2.2]};let s;try{s=JSON.parse(localStorage.moonSave)||structuredClone(D)}catch{s=structuredClone(D)}s.l={...D.l,...s.l};const $=id=>document.getElementById(id),cost=n=>Math.floor(U[n][0]*U[n][1]**s.l[n]),pc=()=>(1+s.l.glove+s.l.laser*8)*2**s.l.portal,ps=()=>s.l.drill*2+s.l.rover*10+s.l.base*50,fmt=n=>n<1000?Math.floor(n).toLocaleString():n<1e6?(n/1e3).toFixed(1)+'K':n<1e9?(n/1e6).toFixed(1)+'M':(n/1e9).toFixed(1)+'B';
function ui(){$('dust').textContent=fmt(s.dust);$('pc').textContent=fmt(pc());$('ps').textContent=fmt(ps());$('clicks').textContent=fmt(s.clicks);for(const n in U){$(n+'L').textContent='Lv. '+s.l[n];$(n+'P').textContent=fmt(cost(n));document.querySelector(`[data-u=${n}]`).disabled=s.dust<cost(n)}let d=s.dust;$('phase').textContent=d>=10000?'🌕 Legendary Full Moon':d>=2500?'🌔 Waxing Moon Master':d>=500?'🌓 Half Moon Miner':d>=100?'🌒 Crescent Collector':'🌑 New Moon Explorer';$('goal').textContent=d>=10000?'🏆 Moon Legend!':d>=1500?'🏢 Moon Base unlocked!':d>=500?'🌓 Half Moon unlocked!':d>=100?'🌒 Crescent Moon unlocked!':`First goal: collect 100 moon dust. (${fmt(d)}/100)`}
$('moon').onclick=e=>{let now=Date.now();s.combo=now-s.last<700?Math.min(s.combo+1,25):1;s.last=now;let mult=1+Math.floor(s.combo/5)*.1,earn=Math.floor(pc()*mult);s.dust+=earn;s.clicks++;$('combo').textContent=s.combo>=5?`🔥 ${s.combo}x combo — ${mult.toFixed(1)}x power!`:'';let f=document.createElement('div');f.className='float';f.textContent='+'+fmt(earn);f.style.left=e.clientX+'px';f.style.top=e.clientY+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),800);ui()};document.querySelectorAll('.upgrade').forEach(b=>b.onclick=()=>{let n=b.dataset.u,c=cost(n);if(s.dust>=c){s.dust-=c;s.l[n]++;ui()}});$('save').onclick=()=>{localStorage.moonSave=JSON.stringify(s);$('goal').textContent='Game saved!'};$('reset').onclick=()=>{if(confirm('Reset all progress?')){s=structuredClone(D);localStorage.removeItem('moonSave');ui()}};setInterval(()=>{s.dust+=ps()/10;ui()},100);setInterval(()=>localStorage.moonSave=JSON.stringify(s),15000);for(let i=0;i<100;i++){let x=document.createElement('i');x.className='star';let z=Math.random()*3+1;x.style.cssText=`width:${z}px;height:${z}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*2}s`;document.body.appendChild(x)}ui();
</script></body></html>

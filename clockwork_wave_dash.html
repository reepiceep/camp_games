<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Clockwork Wave Dash V10 — Forward Launch</title>
<style>
  :root {
    --cyan: #e7a64b;
    --green: #8fcf72;
    --yellow: #e8bb61;
    --pink: #c86c42;
    --panel: rgba(25, 14, 9, .94);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #120b07;
    font-family: Arial, Helvetica, sans-serif;
    touch-action: none;
    user-select: none;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  #ui {
    position: fixed;
    inset: 0;
    color: #fff;
    pointer-events: none;
    text-shadow: 0 2px 8px #000;
  }

  #hud {
    display: none;
  }


  #bossHud {
    position: absolute;
    top: 66px;
    left: 50%;
    width: min(520px, 68vw);
    transform: translateX(-50%);
    display: none;
    text-align: center;
  }

  #bossName {
    margin-bottom: 5px;
    color: #ffe1a0;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 2px;
  }

  #bossBarOuter {
    height: 18px;
    overflow: hidden;
    border: 3px solid #3a190d;
    border-radius: 4px;
    background:
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,.04) 0 12px,
        rgba(0,0,0,.15) 12px 24px
      ),
      #160b07;
    box-shadow:
      0 0 0 2px #b96b34,
      0 0 18px rgba(230, 108, 45, .48);
  }

  #bossBarInner {
    width: 100%;
    height: 100%;
    background:
      linear-gradient(180deg, #fff0a2 0%, #e96e2f 38%, #8d251d 100%);
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.22);
    transition: width .08s linear;
  }

  #bossPhase {
    margin-top: 5px;
    color: #d99c63;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 1px;
  }

  #bossWarning {
    position: absolute;
    top: 16%;
    left: 50%;
    transform: translateX(-50%);
    display: none;
    padding: 7px 15px;
    border: 2px solid #df7a38;
    border-radius: 6px;
    background: rgba(40, 12, 7, .78);
    color: #ffe5b7;
    font-weight: 900;
    letter-spacing: 2px;
    box-shadow: 0 0 24px rgba(224, 85, 37, .4);
  }

  #progressOuter {
    position: absolute;
    top: 15px;
    left: 50%;
    width: min(480px, 58vw);
    height: 16px;
    transform: translateX(-50%);
    border: 3px solid #fff;
    border-radius: 18px;
    background: rgba(0, 0, 0, .45);
    overflow: hidden;
  }

  #progressInner {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #5bff79, #e9ff54);
    box-shadow: 0 0 12px #5bff79;
  }

  #percent {
    position: absolute;
    top: 38px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 17px;
    font-weight: 900;
  }

  #difficultyTag {
    position: absolute;
    top: 15px;
    left: 16px;
    padding: 7px 12px;
    border: 2px solid rgba(255,255,255,.8);
    border-radius: 9px;
    background: rgba(0,0,0,.35);
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 1px;
  }

  #attempt {
    position: absolute;
    top: 25%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(32px, 7vw, 68px);
    font-weight: 900;
    letter-spacing: 4px;
    opacity: 0;
  }

  #controls {
    position: absolute;
    left: 14px;
    bottom: 14px;
    font-size: 13px;
    opacity: .82;
  }

  #pauseBtn {
    position: absolute;
    right: 15px;
    bottom: 15px;
    pointer-events: auto;
    padding: 9px 14px;
    border: 2px solid #fff;
    border-radius: 9px;
    color: #fff;
    background: rgba(0,0,0,.45);
    font-weight: 900;
    cursor: pointer;
  }


  #musicBtn {
    position: absolute;
    right: 102px;
    bottom: 15px;
    pointer-events: auto;
    padding: 9px 13px;
    border: 2px solid #d99b48;
    border-radius: 9px;
    color: #ffe9bd;
    background: rgba(36, 19, 10, .82);
    font-weight: 900;
    cursor: pointer;
  }

  #musicBtn.off {
    opacity: .62;
    filter: grayscale(.65);
  }

  .rivets {
    position: relative;
  }

  .rivets::before,
  .rivets::after {
    content: "";
    position: absolute;
    top: 10px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffe1a0, #8d4b27 70%);
    box-shadow: 0 0 0 2px #341a0d;
  }

  .rivets::before { left: 10px; }
  .rivets::after { right: 10px; }

  #overlay {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 18px;
    pointer-events: auto;
    background: radial-gradient(circle at center, rgba(163, 91, 35, .15), rgba(0,0,0,.62));
  }

  .panel {
    width: min(700px, 94vw);
    padding: 24px;
    border: 4px solid #d69843;
    border-radius: 12px;
    background:
      linear-gradient(135deg, rgba(255,226,166,.10), transparent 38%),
      repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 2px, transparent 2px 7px),
      var(--panel);
    box-shadow:
      0 0 0 5px rgba(77, 38, 18, .88),
      0 0 0 8px rgba(214, 152, 67, .18),
      0 18px 60px rgba(0,0,0,.62),
      inset 0 0 48px rgba(218, 145, 58, .09);
    text-align: center;
  }

  .title {
    margin: 0;
    font-size: clamp(38px, 8vw, 80px);
    line-height: .95;
    letter-spacing: 4px;
    background: linear-gradient(180deg, #fff3cc 0%, #e7ae58 48%, #8e4e27 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter:
      drop-shadow(0 3px 0 #3f2112)
      drop-shadow(0 7px 12px rgba(0,0,0,.8));
  }

  .subtitle {
    margin: 12px 0 20px;
    color: #e8c58d;
    font-size: clamp(15px, 2.5vw, 21px);
  }

  .difficultyGrid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 20px 0 14px;
  }

  .difficulty {
    min-height: 104px;
    border: 3px solid #fff;
    border-radius: 13px;
    color: #fff;
    background: rgba(255,255,255,.07);
    cursor: pointer;
    font-weight: 900;
    transition: transform .12s ease, filter .12s ease, background .12s ease;
  }

  .difficulty:hover,
  .difficulty:focus-visible {
    transform: translateY(-3px) scale(1.02);
    filter: brightness(1.2);
    outline: none;
  }

  .difficulty strong {
    display: block;
    font-size: clamp(19px, 3vw, 28px);
    letter-spacing: 1px;
  }

  .difficulty small {
    display: block;
    margin-top: 7px;
    font-size: 12px;
    opacity: .82;
  }

  .easy { border-color: var(--green); box-shadow: inset 0 0 18px rgba(114,255,119,.12); }
  .medium { border-color: var(--yellow); box-shadow: inset 0 0 18px rgba(255,231,91,.12); }
  .hard { border-color: var(--pink); box-shadow: inset 0 0 18px rgba(255,93,200,.12); }

  .messageTitle {
    margin: 0 0 10px;
    font-size: clamp(36px, 8vw, 72px);
  }

  .messageText {
    margin: 8px 0;
    font-size: clamp(16px, 2.7vw, 22px);
  }

  .actionRow {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 11px;
    margin-top: 18px;
  }

  .actionBtn {
    pointer-events: auto;
    min-width: 135px;
    padding: 12px 17px;
    border: 3px solid #fff;
    border-radius: 11px;
    color: #fff;
    background: rgba(255,255,255,.09);
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
  }

  .actionBtn.primary {
    border-color: var(--green);
    background: rgba(114,255,119,.15);
  }

  .bestLine {
    margin-top: 14px;
    font-size: 14px;
    opacity: .85;
  }

  @media (max-width: 620px) {
    .panel { padding: 18px 14px; }
    .difficultyGrid { grid-template-columns: 1fr; gap: 9px; }
    .difficulty { min-height: 72px; }
    .difficulty small { margin-top: 4px; }
    #progressOuter { width: 55vw; }
    #controls { max-width: 60vw; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="ui">
  <div id="hud">
    <div id="difficultyTag">MEDIUM</div>
    <div id="progressOuter"><div id="progressInner"></div></div>
    <div id="percent">0%</div>
    <div id="bossHud">
      <div id="bossName">THE BONEWORKS WARDEN</div>
      <div id="bossBarOuter"><div id="bossBarInner"></div></div>
      <div id="bossPhase">PHASE I · AWAKENING</div>
    </div>
    <div id="bossWarning">WARDEN AWAKENS</div>
    <div id="attempt">ATTEMPT 1</div>
    <div id="controls">Hold SPACE / mouse / touch = up · Release = down · R = restart</div>
    <button id="musicBtn">Music: On</button>
    <button id="pauseBtn">Pause</button>
  </div>

  <div id="overlay">
    <div class="panel rivets" id="panel">
      <h1 class="title">CLOCKWORK WAVE</h1>
      <p class="subtitle">Fly through the Grand Brassworks and survive the clockwork gauntlet.</p>

      <div class="difficultyGrid">
        <button class="difficulty easy" data-mode="easy">
          <strong>EASY</strong>
          <small>Wide path · now tougher</small>
        </button>
        <button class="difficulty medium" data-mode="medium">
          <strong>MEDIUM</strong>
          <small>Balanced brassworks</small>
        </button>
        <button class="difficulty hard" data-mode="hard">
          <strong>HARD</strong>
          <small>Fairer route · giant boss fight</small>
        </button>
      </div>

      <div class="bestLine" id="bestLine">Best: Easy 0% · Medium 0% · Hard 0%</div>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  const hud = document.getElementById("hud");
  const overlay = document.getElementById("overlay");
  const panel = document.getElementById("panel");
  const progressInner = document.getElementById("progressInner");
  const percentEl = document.getElementById("percent");
  const difficultyTag = document.getElementById("difficultyTag");
  const attemptEl = document.getElementById("attempt");
  const pauseBtn = document.getElementById("pauseBtn");
  const musicBtn = document.getElementById("musicBtn");
  const bestLine = document.getElementById("bestLine");
  const bossHud = document.getElementById("bossHud");
  const bossBarInner = document.getElementById("bossBarInner");
  const bossPhaseEl = document.getElementById("bossPhase");
  const bossWarningEl = document.getElementById("bossWarning");

  const MODES = {
    easy: {
      label: "EASY",
      speed: 315,
      gapScale: 1.31,
      hazardScale: .52,
      length: 9300,
      color: "#dca34f"
    },
    medium: {
      label: "MEDIUM",
      speed: 340,
      gapScale: 1.22,
      hazardScale: .62,
      length: 10200,
      color: "#65b7a5"
    },
    hard: {
      label: "HARD",
      speed: 388,
      gapScale: 1.10,
      hazardScale: .88,
      length: 13900,
      color: "#c65f3b"
    }
  };

  let W = 0;
  let H = 0;
  let dpr = 1;
  let last = performance.now();

  let modeKey = "medium";
  let mode = MODES.medium;
  let worldLength = mode.length;
  let cameraX = 0;
  let holding = false;
  let running = false;
  let paused = false;
  let dead = false;
  let completed = false;
  let startDelay = 0;
  let launchGrace = 0;
  let pulse = 0;
  let shake = 0;
  let attempts = { easy: 0, medium: 0, hard: 0 };

  let bossStart = Infinity;
  let bossEnd = Infinity;
  let bossActive = false;
  let bossDefeated = false;
  let bossTime = 0;
  let bossHp = 100;
  let bossAttackTimer = 0;
  let bossAttackIndex = 0;
  let bossFlash = 0;
  let bossAnnounce = 0;
  let bossProjectiles = [];
  let bossBeams = [];
  let bossColumns = [];
  let bossSparks = [];
  let bossLunge = 0;
  let bossRecoil = 0;
  let bossMouthGlow = 0;
  let bossEyePulse = 0;

  let audioContext = null;
  let musicMaster = null;
  let musicTimer = null;
  let musicStep = 0;
  let musicEnabled = true;

  function ensureAudio() {
    if (!musicEnabled) return;
    if (!audioContext) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) {
        musicEnabled = false;
        musicBtn.textContent = "Music: Unsupported";
        musicBtn.classList.add("off");
        return;
      }
      audioContext = new AudioCtx();
      musicMaster = audioContext.createGain();
      musicMaster.gain.value = .13;
      musicMaster.connect(audioContext.destination);
    }

    if (audioContext.state === "suspended") {
      audioContext.resume();
    }

    if (!musicTimer) {
      musicStep = 0;
      scheduleClockworkMusic();
      musicTimer = setInterval(scheduleClockworkMusic, 155);
    }
  }

  function stopMusic() {
    if (musicTimer) {
      clearInterval(musicTimer);
      musicTimer = null;
    }
    if (musicMaster && audioContext) {
      musicMaster.gain.cancelScheduledValues(audioContext.currentTime);
      musicMaster.gain.setTargetAtTime(0.0001, audioContext.currentTime, .05);
    }
  }

  function playTone(frequency, duration, volume, type = "triangle", detune = 0) {
    if (!audioContext || !musicMaster || !musicEnabled) return;

    const now = audioContext.currentTime;
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();
    const filter = audioContext.createBiquadFilter();

    oscillator.type = type;
    oscillator.frequency.value = frequency;
    oscillator.detune.value = detune;

    filter.type = "lowpass";
    filter.frequency.value = type === "sawtooth" ? 1100 : 2200;
    filter.Q.value = 2.4;

    gain.gain.setValueAtTime(.0001, now);
    gain.gain.exponentialRampToValueAtTime(Math.max(.0001, volume), now + .012);
    gain.gain.exponentialRampToValueAtTime(.0001, now + duration);

    oscillator.connect(filter);
    filter.connect(gain);
    gain.connect(musicMaster);
    oscillator.start(now);
    oscillator.stop(now + duration + .03);
  }

  function playSteamPercussion(step) {
    if (!audioContext || !musicMaster || !musicEnabled) return;
    const now = audioContext.currentTime;

    if (step % 4 === 0) {
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(118, now);
      osc.frequency.exponentialRampToValueAtTime(42, now + .16);
      gain.gain.setValueAtTime(.18, now);
      gain.gain.exponentialRampToValueAtTime(.0001, now + .18);
      osc.connect(gain);
      gain.connect(musicMaster);
      osc.start(now);
      osc.stop(now + .2);
    }

    if (step % 2 === 1) {
      const length = Math.floor(audioContext.sampleRate * .045);
      const buffer = audioContext.createBuffer(1, length, audioContext.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < length; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2.8);
      }
      const source = audioContext.createBufferSource();
      const filter = audioContext.createBiquadFilter();
      const gain = audioContext.createGain();
      source.buffer = buffer;
      filter.type = "highpass";
      filter.frequency.value = 3600;
      gain.gain.value = step % 4 === 3 ? .055 : .025;
      source.connect(filter);
      filter.connect(gain);
      gain.connect(musicMaster);
      source.start(now);
    }
  }

  function scheduleClockworkMusic() {
    if (!audioContext || !musicMaster || !musicEnabled) return;
    musicMaster.gain.setTargetAtTime(.13, audioContext.currentTime, .03);

    // Original composition: "Misery — Clockwork Mix".
    const scale = [0, 3, 5, 7, 10];
    const bassRoots = [110, 98, 82.41, 92.5];
    const phrase = [0, 2, 1, 4, 3, 1, 2, 0, 4, 2, 3, 1, 0, 1, 3, 2];
    const step = musicStep++;
    const bar = Math.floor(step / 16);
    const root = bassRoots[bar % bassRoots.length];

    playSteamPercussion(step);

    if (step % 4 === 0) {
      playTone(root, .52, .065, "sawtooth", -5);
      playTone(root * 2, .31, .025, "triangle", 5);
    }

    const degree = scale[phrase[step % phrase.length]];
    const note = root * 2 * Math.pow(2, degree / 12);
    playTone(note, .13, .042, "square", step % 2 ? 4 : -4);

    if (step % 8 === 6) {
      playTone(note * 1.5, .28, .025, "triangle");
    }

    if (step % 16 === 15) {
      playTone(root * 4, .5, .018, "sine");
    }

    if (bossActive && step % 4 === 2) {
      playTone(root * 3, .20, .025, "square", step % 8 ? -9 : 9);
    }

    if (bossActive && bossHp <= 36 && step % 2 === 0) {
      playTone(root * 1.5, .11, .024, "sawtooth", -12);
      playTone(root * 3.02, .08, .014, "square", 8);
    }

    if (bossActive && step % 8 === 3) {
      playTone(root * .75, .28, .034, "sawtooth", -18);
    }
  }

  function toggleMusic() {
    musicEnabled = !musicEnabled;
    musicBtn.textContent = musicEnabled ? "Music: On" : "Music: Off";
    musicBtn.classList.toggle("off", !musicEnabled);

    if (musicEnabled) {
      ensureAudio();
    } else {
      stopMusic();
    }
  }


  const best = {
    easy: Number(localStorage.getItem("pulseWaveBest_easy") || 0),
    medium: Number(localStorage.getItem("pulseWaveBest_medium") || 0),
    hard: Number(localStorage.getItem("pulseWaveBest_hard") || 0)
  };

  const player = {
    x: 150,
    y: 0,
    size: 20,
    angle: Math.PI / 4,
    trail: []
  };

  let nodes = [];
  let spikes = [];
  let saws = [];
  let diamonds = [];
  let particles = [];
  let stars = [];

  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  function smoothstep(t) {
    return t * t * (3 - 2 * t);
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    player.x = clamp(W * .2, 105, 175);
    if (!running && !dead && !completed) player.y = H / 2;

    buildStars();
    if (nodes.length) buildLevel(modeKey);
  }

  function buildStars() {
    stars = [];
    const count = Math.round((W * H) / 11000);
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        size: .6 + Math.random() * 1.8,
        depth: .2 + Math.random() * .8
      });
    }
  }

  function seededNoise(index) {
    const x = Math.sin(index * 91.713 + mode.speed * .013) * 43758.5453;
    return (x - Math.floor(x)) * 2 - 1;
  }

  function buildLevel(key) {
    modeKey = key;
    mode = MODES[key];
    worldLength = mode.length;

    nodes = [];
    spikes = [];
    saws = [];
    diamonds = [];

    bossStart = modeKey === "hard" ? worldLength - 4700 : Infinity;
    bossEnd = modeKey === "hard" ? worldLength - 180 : Infinity;
    bossActive = false;
    bossDefeated = false;
    bossTime = 0;
    bossHp = 100;
    bossAttackTimer = 0;
    bossAttackIndex = 0;
    bossFlash = 0;
    bossAnnounce = 0;
    bossProjectiles = [];
    bossBeams = [];
    bossColumns = [];
    bossSparks = [];
    bossLunge = 0;
    bossRecoil = 0;
    bossMouthGlow = 0;
    bossEyePulse = 0;
    bossHud.style.display = "none";
    bossWarningEl.style.display = "none";
    bossBarInner.style.width = "100%";

    const spacing = 430;
    const count = Math.ceil((worldLength + 900) / spacing);
    let centerRatio = .5;

    for (let i = 0; i <= count; i++) {
      const progress = i / count;
      const difficultyRamp = .97 - progress * .12;

      const nodeWorldX = i * spacing;
      const inBossArena =
        modeKey === "hard" &&
        nodeWorldX >= bossStart - 650;

      if (i < 4 || i > count - 3 || inBossArena) {
        centerRatio = .5;
      } else {
        const wave = Math.sin(i * .72) * .105;
        const noise = seededNoise(i) * .052;
        centerRatio = clamp(.5 + wave + noise, .29, .71);
      }

      const baseGap = clamp(H * .34, 150, 245);
      const minimumGap =
        modeKey === "easy" ? 178 :
        modeKey === "medium" ? 162 :
        146;

      let gap = clamp(
        baseGap * mode.gapScale * difficultyRamp,
        minimumGap,
        modeKey === "easy" ? 320 :
        modeKey === "medium" ? 310 :
        292
      );

      // Extra-safe opening corridor.
      if (i < 4) {
        gap = Math.max(gap, Math.min(H * .68, 400));
      }

      // Wide, centered boss arena so the fight is readable and fair.
      if (inBossArena) {
        gap = Math.max(gap, Math.min(H * .56, 350));
      }

      nodes.push({
        x: i * spacing,
        center: H * centerRatio,
        gap
      });
    }

    // Hand-tuned hazard rhythm so obstacles feel designed rather than random.
    const hazardStart = 1700;
    const hazardEnd = modeKey === "hard" ? bossStart - 620 : worldLength - 1150;
    const baseSpacing = modeKey === "easy" ? 515 : modeKey === "medium" ? 465 : 390;

    let index = 0;
    for (let x = hazardStart; x < hazardEnd; x += baseSpacing) {
      const section = Math.floor(x / 1600);
      const pattern = (index + section) % 8;
      const boundary = pattern % 2 === 0 ? "top" : "bottom";

      const useSaw =
        modeKey === "easy" ? index % 11 === 8 :
        modeKey === "medium" ? index % 9 === 6 :
        index % 7 === 5;

      if (useSaw) {
        const sample = corridorAt(x);
        saws.push({
          x,
          y: sample.center + (pattern === 2 ? -sample.gap * .09 : sample.gap * .09),
          r: modeKey === "easy" ? 20 : modeKey === "medium" ? 20 : 25,
          rotation: 0
        });
      } else {
        spikes.push({
          x,
          side: boundary,
          size:
            modeKey === "easy" ? 28 :
            modeKey === "medium" ? 28 :
            30
        });
      }

      if (index % 5 === 0) {
        const sample = corridorAt(x + baseSpacing * .46);
        diamonds.push({
          x: x + baseSpacing * .46,
          y: sample.center,
          size: 12
        });
      }
      index++;
    }
  }

  function corridorAt(worldX) {
    if (nodes.length < 2) {
      return { center: H / 2, gap: H * .35 };
    }

    const spacing = nodes[1].x - nodes[0].x;
    const raw = clamp(worldX / spacing, 0, nodes.length - 1.001);
    const i = Math.floor(raw);
    const t = smoothstep(raw - i);
    const a = nodes[i];
    const b = nodes[Math.min(i + 1, nodes.length - 1)];

    return {
      center: lerp(a.center, b.center, t),
      gap: lerp(a.gap, b.gap, t)
    };
  }

  function topAt(x) {
    const c = corridorAt(x);
    return c.center - c.gap / 2;
  }

  function bottomAt(x) {
    const c = corridorAt(x);
    return c.center + c.gap / 2;
  }
